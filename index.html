<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 비트코인 시세</title>
<meta name="description" content="업비트 WebSocket API 기반 실시간 비트코인(BTC/KRW) 시세">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <header>
    <h1>₿ 비트코인 <span class="pair">BTC/KRW</span></h1>
    <span id="status" class="status off">연결 중…</span>
  </header>

  <div id="price" class="price">-</div>
  <div id="change" class="change">-</div>

  <div id="tf" class="tf"></div>
  <canvas id="chart"></canvas>
  <div class="legend">
    <span><i style="background:#ef4444"></i>상승</span>
    <span><i style="background:#3b82f6"></i>하락</span>
    <span><i style="background:#facc15"></i>MA5</span>
    <span><i style="background:#a78bfa"></i>MA20</span>
  </div>

  <section class="signal">
    <div class="signal-head">
      <span class="signal-title">기술적 분석 신호 <small id="signal-tf"></small></span>
      <span id="signal-badge" class="badge neutral">-</span>
    </div>
    <ul id="signal-reasons"></ul>
    <p class="disclaimer">선택한 봉 단위의 이동평균·RSI로 계산한 참고용 신호이며 투자 조언이 아닙니다. 투자 판단과 손익은 본인 책임입니다.</p>
  </section>

  <dl class="stats">
    <div><dt>고가 (당일)</dt><dd id="high">-</dd></div>
    <div><dt>저가 (당일)</dt><dd id="low">-</dd></div>
    <div><dt>24h 거래대금</dt><dd id="value">-</dd></div>
    <div><dt>24h 거래량</dt><dd id="volume">-</dd></div>
  </dl>

  <footer>
    <span id="time">-</span>
    <span>데이터 출처: <a href="https://docs.upbit.com/kr/reference/api-overview" target="_blank" rel="noopener">Upbit Open API</a></span>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
